name: CI/CD

# Niente trigger sui tag: sul tag gira deploy.yml, che ricostruisce comunque
# l'app dentro la build Docker. Farla girare anche qui sarebbe lavoro doppio.
on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - develop
      - 'release/**'

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 📦 Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build -- --configuration production
