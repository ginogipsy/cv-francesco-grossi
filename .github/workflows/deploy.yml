name: Deploy image

# Il deploy parte SOLO da un tag di versione: nessun push su develop/master
# pubblica immagini. workflow_dispatch resta disponibile per ri-pubblicare un
# tag esistente (va selezionato il tag nel menu "Use workflow from").
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Due tag pushati a distanza ravvicinata non si sovrascrivono a vicenda su
# :latest. Niente cancel-in-progress: una pubblicazione avviata va completata.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    # Per richiedere un'approvazione manuale anche sui tag, decommentare:
    # environment: cv-francesco-grossi

    steps:
      # workflow_dispatch puo' essere lanciato da un branch qualsiasi: senza
      # questo guard un run da develop pubblicherebbe :latest con codice non
      # rilasciato.
      - name: Require a version tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Questo workflow va eseguito da un tag v*.*.*, non da ${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # La build multi-stage gira qui sul runner (16 GB di RAM), non sulla
      # e2-micro: la VM si limita a fare `docker pull` dell'immagine finita.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Da un tag v1.2.3 genera ghcr.io/<owner>/cv-francesco-grossi:1.2.3 e :latest.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cv-francesco-grossi
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Per avere anche il tag mobile di minor (es. 1.2), decommentare:
            # type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La cache dei layer riusa npm ci tra release quando il lockfile non
          # cambia: il grosso del tempo di build sparisce.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Immagine single-arch: l'attestazione aggiungerebbe solo voci
          # "unknown/unknown" nella pagina del package su GHCR.
          provenance: false

      - name: Summary
        env:
          # I tag arrivano su piu' righe: passarli via env evita che
          # l'interpolazione spezzi il comando.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 🐳 Immagine pubblicata"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
