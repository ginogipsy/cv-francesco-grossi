<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- Prima di ogni URL relativo: e' <base> a risolverli (favicon compresa). -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ── SEO e Lingua ─────────────────────────────────────────────────────── -->
  <title>Francesco Grossi · Back-end Java Developer</title>
  <meta name="description"
        content="Sviluppatore Back-end Java con quasi 5 anni di esperienza in microservizi, Spring Boot, architetture cloud GCP e CI/CD. Curriculum interattivo e portfolio.">
  <meta name="author" content="Francesco Grossi">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta http-equiv="content-language" content="it">
  <link rel="canonical" href="https://francescogrossi.it/">
  <link rel="alternate" hreflang="it" href="https://francescogrossi.it/">
  <link rel="alternate" hreflang="x-default" href="https://francescogrossi.it/">
  <meta name="theme-color" content="#07090f">

  <!-- Google ignora keywords dal 2009. Innocuo, utile solo a motori minori. -->
  <meta name="keywords"
        content="Francesco Grossi, curriculum, CV, portfolio, back-end developer, Java, Spring Boot, microservizi, Google Cloud Platform, GCP, Angular, Docker, CI/CD">

  <!-- ── Icone per Browser e Google Search ──────────────────────────────── -->
  <!-- Google Search richiede un'icona che sia un multiplo di 48px (es. 48x48, 192x192, 512x512 o SVG). -->
  <link rel="shortcut icon" href="https://francescogrossi.it/favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="https://francescogrossi.it/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="https://francescogrossi.it/assets/icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://francescogrossi.it/assets/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://francescogrossi.it/assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- ── Open Graph (LinkedIn, Facebook, WhatsApp, Telegram, Slack) ───────── -->
  <!-- Gli URL qui devono essere ASSOLUTI: gli scraper non applicano <base>. -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Francesco Grossi">
  <meta property="og:locale" content="it_IT">
  <meta property="og:locale:alternate" content="en_GB">
  <meta property="og:url" content="https://francescogrossi.it/">
  <meta property="og:title" content="Francesco Grossi · Back-end Java Developer">
  <meta property="og:description"
        content="Sviluppatore Back-end Java con quasi 5 anni di esperienza in microservizi, Spring Boot, architetture cloud GCP e CI/CD. Curriculum interattivo e portfolio.">
  <!-- width/height dichiarati: LinkedIn e Facebook renderizzano la card grande
       al primo scrape invece di aspettare di aver scaricato l'immagine.
       Devono corrispondere ai pixel reali del file. -->
  <meta property="og:image" content="https://francescogrossi.it/assets/preview.png">
  <meta property="og:image:secure_url" content="https://francescogrossi.it/assets/preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Francesco Grossi — Back-end Java Developer">
  <meta property="profile:first_name" content="Francesco">
  <meta property="profile:last_name" content="Grossi">

  <!-- ── Twitter / X ──────────────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Francesco Grossi · Back-end Java Developer">
  <meta name="twitter:description"
        content="Sviluppatore Back-end Java con quasi 5 anni di esperienza in microservizi, Spring Boot, architetture cloud GCP e CI/CD. Curriculum interattivo e portfolio.">
  <meta name="twitter:image" content="https://francescogrossi.it/assets/preview.png">
  <meta name="twitter:image:alt" content="Francesco Grossi — Back-end Java Developer">

  <!-- ── Font ─────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">

  <!-- ── Dati strutturati ─────────────────────────────────────────────────── -->
  <!-- sameAs collega il dominio ai profili gia' linkati nell'app: e' il segnale
       con cui Google riconosce che sono la stessa persona. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Francesco Grossi",
      "jobTitle": "Back-end Java Developer",
      "url": "https://francescogrossi.it/",
      "image": "https://francescogrossi.it/assets/profile.jpg",
      "inLanguage": "it-IT",
      "sameAs": [
        "https://github.com/ginogipsy",
        "https://www.linkedin.com/in/francescogrossi92/"
      ],
      "knowsAbout": [
        "Java",
        "Spring Boot",
        "Microservizi",
        "SOAP",
        "Struts2",
        "MyBatis",
        "Google Cloud Platform",
        "Angular",
        "Docker"
      ],
      "knowsLanguage": [
        "Italian",
        "English"
      ]
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
