server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Prova a servire la risorsa come file ($uri),
        # poi come directory ($uri/),
        # se fallisce rimanda a index.html (fallback per Angular SPA)
        try_files $uri $uri/ /index.html;
    }

    # Gestione errori standard
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Ottimizzazione: cache per file statici (opzionale)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
