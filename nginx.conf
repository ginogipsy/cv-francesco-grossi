# Server block della SPA, montato come /etc/nginx/conf.d/default.conf.
# Resta in chiaro sulla porta 80: la TLS la termina l'Nginx della VM,
# che fa da reverse proxy verso il container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nasconde la versione di Nginx da header e pagine di errore.
    server_tokens off;

    # L'app non riceve upload: le request anomale vengono tagliate subito.
    client_max_body_size 1m;

    # --- Compressione -------------------------------------------------------
    # text/html e' sempre compresso da Nginx e non va elencato in gzip_types.
    # Fuori dalla lista jpg/png/woff2: sono gia' compressi alla sorgente e
    # rigzipparli costa CPU (sulla e2-micro e' condivisa) senza guadagno.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # --- Health check -------------------------------------------------------
    # Usato dalla HEALTHCHECK del Dockerfile e utilizzabile come probe esterna.
    location = /healthz {
        access_log off;
        # default_type e non add_header: il main nginx.conf imposta gia'
        # application/octet-stream e si otterrebbero due Content-Type.
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- index.html: mai in cache -------------------------------------------
    # Con outputHashing: all i bundle cambiano nome a ogni build. Se il browser
    # tiene in cache index.html continua a chiedere i chunk della build vecchia,
    # che dopo il deploy non esistono piu' (pagina bianca / 404 sugli asset).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Bundle con hash nel nome: cache aggressiva -------------------------
    # main-<hash>.js e styles-<hash>.css cambiano nome a ogni modifica,
    # quindi possono essere immutable per un anno senza rischio di staleness.
    location ~* \.(?:js|css)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Asset da public/: il nome NON e' hashato ---------------------------
    # outputHashing non tocca i file copiati da public/: favicon.svg e
    # assets/profile.jpg mantengono il nome originale. Con un anno di cache
    # non potresti piu' sostituire la foto senza rinominare il file.
    location ~* \.(?:svg|jpg|jpeg|png|gif|ico|webp|avif|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Fallback SPA -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # add_header dichiarato in un location azzera quelli ereditati dai
        # livelli superiori: per questo gli header di sicurezza sono ripetuti
        # in ogni blocco che ne definisce di propri.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # File nascosti (.git, .env) mai serviti.
    location ~ /\. {
        deny all;
    }
}
